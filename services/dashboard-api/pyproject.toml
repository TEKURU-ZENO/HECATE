[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dashboard-api"
version = "0.1.0"
description = "FastAPI gateway aggregator that serves the React frontend via HTTP & WebSockets."
authors = [{name = "Dev Mehta"}]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"