[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "graph-service"
version = "0.1.0"
description = "FastAPI backend service for HECATE Knowledge Graph and Neo4j integration."
authors = [{name = "Dev Mehta"}]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
