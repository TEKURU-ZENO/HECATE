[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "digital-twin-service"
version = "2.0.0"
description = "FastAPI service to model cluster states and simulate recovery plans."
authors = [{name = "Dev Mehta"}]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
