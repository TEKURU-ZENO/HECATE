{{- range $name, $config := .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $config.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "hecate/{{ $name }}:{{ $.Values.global.environment }}"
          ports:
            - containerPort: {{ $config.port }}
          resources:
            {{- toYaml $config.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ $config.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: {{ $config.port }}
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
spec:
  ports:
    - port: {{ $config.port }}
      targetPort: {{ $config.port }}
  selector:
    app: {{ $name }}
---
{{- end }}
