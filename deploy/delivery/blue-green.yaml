apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-service-blue
  namespace: hecate-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: anomaly-service
      version: blue
  template:
    metadata:
      labels:
        app: anomaly-service
        version: blue
    spec:
      containers:
        - name: anomaly-service
          image: hecate/anomaly-service:v1.0.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-service-green
  namespace: hecate-system
spec:
  replicas: 3
  selector:
    matchLabels:
      app: anomaly-service
      version: green
  template:
    metadata:
      labels:
        app: anomaly-service
        version: green
    spec:
      containers:
        - name: anomaly-service
          image: hecate/anomaly-service:v2.0.0
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: anomaly-service-active
  namespace: hecate-system
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: anomaly-service
    version: blue # Change to "green" to route to the green deployment
