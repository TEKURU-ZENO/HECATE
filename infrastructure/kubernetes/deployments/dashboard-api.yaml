apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-api
  namespace: hecate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard-api
  template:
    metadata:
      labels:
        app: dashboard-api
    spec:
      serviceAccountName: monitoring-agent
      containers:
        - name: dashboard-api
          image: hecate/dashboard-api:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"