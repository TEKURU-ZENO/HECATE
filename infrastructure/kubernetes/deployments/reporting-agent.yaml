apiVersion: apps/v1
kind: Deployment
metadata:
  name: reporting-agent
  namespace: hecate-agents
spec:
  replicas: 1
  selector:
    matchLabels:
      app: reporting-agent
  template:
    metadata:
      labels:
        app: reporting-agent
    spec:
      serviceAccountName: monitoring-agent
      containers:
        - name: reporting-agent
          image: hecate/reporting-agent:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"