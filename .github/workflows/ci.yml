name: Monorepo CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest structlog httpx uvicorn fastapi
          find . -name "requirements.txt" -exec pip install -r {} \;
      - name: Run Lint
        run: ruff check . --config pyproject.toml
      - name: Run Tests
        run: pytest tests/