name: Monorepo CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install Lint Tools
        run: pip install ruff mypy pytest
      - name: Run Lint
        run: ruff check . --config pyproject.toml
      - name: Run Tests
        run: pytest tests/