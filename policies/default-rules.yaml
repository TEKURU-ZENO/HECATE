rules:
  cpu_high:
    metric: cpu_usage
    threshold: 90
  memory_high:
    metric: memory_usage
    threshold: 85
  restart_high:
    metric: restart_count
    threshold: 5

topology:
  services:
    - gateway
    - order-service
    - payment-service
    - payment-db
  dependencies:
    - [gateway, order-service]
    - [order-service, payment-service]
    - [payment-service, payment-db]

learning:
  decay_lambda: 0.02

