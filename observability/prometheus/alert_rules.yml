groups:
  # ──────────────────────────────────────────────────────────────────────────────
  # Infrastructure alerts
  # ──────────────────────────────────────────────────────────────────────────────
  - name: hecate.infrastructure
    rules:
      - alert: HighCPUUsage
        expr: avg(rate(container_cpu_usage_seconds_total[5m])) by (pod, namespace) > 0.9
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High CPU usage on {{ $labels.pod }}"
          description: >
            CPU usage is above 90% for more than 2 minutes on pod {{ $labels.pod }}
            in namespace {{ $labels.namespace }}. Current value: {{ $value | humanizePercentage }}.
          runbook_url: "https://github.com/devmehta/hecate/wiki/runbooks/high-cpu"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes / container_spec_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "High memory usage on {{ $labels.pod }}"
          description: >
            Memory usage is above 85% for pod {{ $labels.pod }}
            in namespace {{ $labels.namespace }}. Current: {{ $value | humanizePercentage }}.
          runbook_url: "https://github.com/devmehta/hecate/wiki/runbooks/high-memory"

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 > 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is crash looping"
          description: >
            Pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
            is restarting at {{ $value }} restarts/minute.
          runbook_url: "https://github.com/devmehta/hecate/wiki/runbooks/pod-crash-loop"

      - alert: PodNotReady
        expr: kube_pod_status_ready{condition="true"} == 0
        for: 3m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Pod {{ $labels.pod }} is not ready"
          description: >
            Pod {{ $labels.pod }} in namespace {{ $labels.namespace }}
            has not been ready for 3 minutes.

      - alert: NodeDiskPressure
        expr: kube_node_status_condition{condition="DiskPressure", status="true"} == 1
        for: 1m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Node {{ $labels.node }} has disk pressure"
          description: >
            Kubernetes node {{ $labels.node }} is reporting disk pressure.
            Free up disk space or expand the PVC.

      - alert: NodeMemoryPressure
        expr: kube_node_status_condition{condition="MemoryPressure", status="true"} == 1
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Node {{ $labels.node }} has memory pressure"
          description: >
            Kubernetes node {{ $labels.node }} is reporting memory pressure.

  # ──────────────────────────────────────────────────────────────────────────────
  # Service-level alerts
  # ──────────────────────────────────────────────────────────────────────────────
  - name: hecate.services
    rules:
      - alert: ServiceHighErrorRate
        expr: >
          rate(http_requests_total{status=~"5.."}[5m])
          / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: high
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: >
            Service {{ $labels.service }} has an error rate of
            {{ $value | humanizePercentage }} over the last 5 minutes.

      - alert: ServiceHighLatency
        expr: >
          histogram_quantile(0.99,
            rate(http_request_duration_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "High p99 latency on {{ $labels.service }}"
          description: >
            The 99th percentile latency for {{ $labels.service }} is
            {{ $value }}s, exceeding the 2s SLO threshold.

      - alert: ServiceDown
        expr: up{job=~"hecate-.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "HECATE service {{ $labels.instance }} is down"
          description: >
            The scrape target {{ $labels.instance }} (job={{ $labels.job }})
            has been unreachable for over 1 minute.

  # ──────────────────────────────────────────────────────────────────────────────
  # HECATE agent-specific alerts
  # ──────────────────────────────────────────────────────────────────────────────
  - name: hecate.agents
    rules:
      - alert: HecateAgentDown
        expr: up{job="hecate-agents"} == 0
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "HECATE agent {{ $labels.instance }} is down"
          description: >
            Agent {{ $labels.instance }} has been unreachable for over 1 minute.
            This may impact autonomous remediation capabilities.

      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 10000
        for: 5m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "High Kafka consumer lag for {{ $labels.group }}"
          description: >
            Consumer group {{ $labels.group }} on topic {{ $labels.topic }}
            has a lag of {{ $value }} messages, indicating processing backlog.

      - alert: AnomalyDetectionBacklog
        expr: kafka_consumer_group_lag{group="detection-agent"} > 5000
        for: 3m
        labels:
          severity: high
          team: ml
        annotations:
          summary: "Detection agent has a processing backlog"
          description: >
            The anomaly detection agent is lagging {{ $value }} messages behind,
            which may delay incident detection.

      - alert: RemediationFailureRate
        expr: >
          rate(hecate_remediation_actions_total{status="failed"}[10m])
          / rate(hecate_remediation_actions_total[10m]) > 0.1
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "High remediation failure rate"
          description: >
            More than 10% of remediation actions are failing. Autonomous healing
            may be impaired. Failure rate: {{ $value | humanizePercentage }}.

  # ──────────────────────────────────────────────────────────────────────────────
  # Kafka cluster alerts
  # ──────────────────────────────────────────────────────────────────────────────
  - name: hecate.kafka
    rules:
      - alert: KafkaBrokerDown
        expr: kafka_brokers < 1
        for: 1m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: "Kafka broker count dropped to {{ $value }}"
          description: >
            The number of active Kafka brokers has dropped below the minimum
            threshold. Message delivery is at risk.

      - alert: KafkaUnderReplicatedPartitions
        expr: kafka_server_replicamanager_underreplicatedpartitions > 0
        for: 2m
        labels:
          severity: high
          team: platform
        annotations:
          summary: "Kafka has {{ $value }} under-replicated partitions"
